# 数据库配置模板。
# 使用方法:复制本文件为 config.ini 并填入真实密码。
# config.ini 已被 .gitignore 忽略,不会提交到仓库。

[database]
host = 127.0.0.1
port = 3306
user = root
password = 在这里填入你的数据库密码
database = eve

[security]
# 管理员登录密码:游客只能查询,登录管理员后才能手动更新数据库。
# 部署到公网前务必改成强随机密码。
admin_password = 请修改此密码
# Flask 会话签名密钥:用于防止登录态 Cookie 被伪造,必须是一串随机字符。
# 可用命令生成: python3 -c "import secrets; print(secrets.token_hex(32))"
secret_key = 请改成一串随机字符

[schedule]
# 行情自动更新间隔(秒),默认 7200 = 2 小时;最小 60 秒。
# 服务启动 30 秒后会先执行一次更新,此后按此间隔循环。
update_interval_seconds = 7200
