<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>管理控制台 - EVE 批量制作成本查询</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --success: #10b981;
            --warning: #f59e0b;
            --bg: #0b0f19;
            --card: rgba(255, 255, 255, 0.92);
            --text: #1f2937;
            --muted: #6b7280;
            --border: rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background:
                radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.18) 0%, transparent 35%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.14) 0%, transparent 35%),
                linear-gradient(135deg, #0b0f19 0%, #111827 50%, #0b0f19 100%);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .panel {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 20px;
            padding: 32px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .panel-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .panel-sub {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 22px;
        }

        .home-link {
            display: inline-block;
            font-size: 13px;
            color: #c7d2fe;
            text-decoration: none;
            background: rgba(79, 70, 229, 0.35);
            padding: 6px 14px;
            border-radius: 10px;
            border: 1px solid rgba(199, 210, 254, 0.3);
            margin-bottom: 22px;
        }
        .home-link:hover { background: rgba(79, 70, 229, 0.55); }

        .msg {
            font-size: 14px;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 14px;
        }
        .msg.error   { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; }
        .msg.success { color: #166534; background: #f0fdf4; border: 1px solid #bbf7d0; }

        .input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            margin-bottom: 14px;
            outline: none;
            background: #f9fafb;
        }
        .input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .btn {
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            transition: transform 0.15s, box-shadow 0.2s;
        }
        .btn:hover  { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

        .btn-update {
            background: linear-gradient(135deg, var(--warning) 0%, #d97706 100%);
        }

        .btn-logout {
            background: none;
            color: var(--muted);
            box-shadow: none;
            font-weight: 400;
            font-size: 13px;
            padding: 8px;
            margin-top: 10px;
        }
        .btn-logout:hover { color: #b91c1c; transform: none; box-shadow: none; }

        .hint {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 12px;
            line-height: 1.7;
        }

        .log {
            margin-top: 14px;
            background: #0b0f19;
            color: #d1d5db;
            border-radius: 12px;
            padding: 14px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 260px;
            overflow-y: auto;
            display: none;
        }

        .hidden { display: none !important; }

        @media (max-width: 600px) {
            body { padding: 20px 12px; }
            .panel { padding: 24px 18px; }
        }
    </style>
</head>
<body>
    <div class="panel">
        <a class="home-link" href="/">← 返回查询主页</a>
        <div class="panel-title">🔐 管理控制台</div>
        <div class="panel-sub">EVE 批量制作成本查询 · 数据库维护</div>

        <div id="msg" class="msg hidden"></div>

        <!-- 登录视图 -->
        <div id="view-login">
            <input type="password" id="password" class="input" placeholder="请输入管理员密码"
                   onkeydown="if(event.key==='Enter')login()">
            <button class="btn" id="btn-login" onclick="login()">登录</button>
            <div class="hint">此页面仅供管理员维护行情数据库使用,普通查询请返回主页。<br>密码错误 5 次将锁定 60 秒。行情数据也会按固定间隔自动更新。</div>
        </div>

        <!-- 管理视图 -->
        <div id="view-admin" class="hidden">
            <div class="msg success">✅ 已登录管理员</div>
            <button class="btn btn-update" id="btn-update" onclick="updateDatabase()">🔄 立即更新行情数据库</button>
            <div class="hint">从 ESI 拉取吉他 4-4 全部订单并写入数据库,约需 10-60 秒,完成后下方显示执行日志。</div>
            <div id="log" class="log"></div>
            <button class="btn btn-logout" onclick="logout()">退出登录</button>
        </div>
    </div>

    <script>
        const msgDiv = document.getElementById('msg');
        const viewLogin = document.getElementById('view-login');
        const viewAdmin = document.getElementById('view-admin');
        const logDiv = document.getElementById('log');

        function showMsg(text, type) {
            msgDiv.textContent = text;
            msgDiv.className = 'msg ' + type;
        }
        function hideMsg() {
            msgDiv.classList.add('hidden');
        }

        function render(admin) {
            viewLogin.classList.toggle('hidden', admin);
            viewAdmin.classList.toggle('hidden', !admin);
            if (admin) {
                hideMsg();
                document.querySelector('#view-admin .msg.success').classList.remove('hidden');
            } else {
                setTimeout(() => document.getElementById('password').focus(), 60);
            }
        }

        // 页面加载时检查登录态(会话 Cookie 有效则直接进入管理视图)
        (async () => {
            try {
                const res = await fetch('/admin/status');
                const json = await res.json();
                render(!!(json.success && json.admin));
            } catch (e) {
                render(false);
            }
        })();

        async function login() {
            const btn = document.getElementById('btn-login');
            btn.disabled = true;
            btn.textContent = '登录中...';
            try {
                const res = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: document.getElementById('password').value })
                });
                const json = await res.json();
                if (json.success) {
                    render(true);
                } else {
                    showMsg(json.error || '登录失败', 'error');
                }
            } catch (e) {
                showMsg('网络错误:' + e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '登录';
            }
        }

        async function logout() {
            try { await fetch('/admin/logout', { method: 'POST' }); } catch (e) { /* 网络异常也直接退回登录视图 */ }
            document.getElementById('password').value = '';
            render(false);
        }

        async function updateDatabase() {
            const btn = document.getElementById('btn-update');
            btn.disabled = true;
            btn.textContent = '⏳ 更新中...';
            logDiv.style.display = 'none';
            document.querySelector('#view-admin .msg.success').classList.add('hidden');
            try {
                const res = await fetch('/update_database', { method: 'POST' });
                const json = await res.json();

                if (res.status === 403) {
                    // 会话已失效,退回登录视图
                    render(false);
                    showMsg(json.error || '登录已失效,请重新登录', 'error');
                    return;
                }

                if (json.output) {
                    logDiv.textContent = json.output;
                    logDiv.style.display = 'block';
                    logDiv.scrollTop = 0;
                }

                if (!json.success) {
                    showMsg(json.error || '数据库更新失败', 'error');
                } else {
                    const count = json.updated !== null && json.updated !== undefined
                        ? `(共更新 ${json.updated} 条记录)` : '';
                    showMsg('✅ 数据库更新成功 ' + count, 'success');
                }
            } catch (e) {
                showMsg('更新请求错误:' + e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '🔄 立即更新行情数据库';
            }
        }
    </script>
</body>
</html>
